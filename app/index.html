<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .calculator {
            background: #1c1c2e;
            border-radius: 24px;
            padding: 24px;
            width: 340px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6),
                        inset 0 1px 2px rgba(255,255,255,0.05);
        }
        .display {
            background: #11111e;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
        }
        .display .expression {
            font-size: 18px;
            color: #8888aa;
            word-break: break-all;
            text-align: right;
            min-height: 28px;
            width: 100%;
            transition: all 0.15s;
        }
        .display .result {
            font-size: 40px;
            font-weight: 600;
            color: #ffffff;
            word-break: break-all;
            text-align: right;
            width: 100%;
            line-height: 1.2;
            transition: all 0.15s;
        }
        .display .result.small {
            font-size: 28px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .btn {
            background: #2a2a40;
            border: none;
            border-radius: 14px;
            padding: 18px 0;
            font-size: 22px;
            font-weight: 500;
            color: #eee;
            cursor: pointer;
            transition: all 0.12s ease;
            box-shadow: 0 4px 0 #1a1a2a;
            position: relative;
            top: 0;
        }
        .btn:active {
            top: 4px;
            box-shadow: 0 0px 0 #1a1a2a;
        }
        .btn:hover {
            background: #343450;
        }
        .btn.operator {
            background: #3a2a5a;
            color: #c8a8ff;
            box-shadow: 0 4px 0 #2a1a4a;
        }
        .btn.operator:hover {
            background: #4a3a6a;
        }
        .btn.operator:active {
            box-shadow: 0 0px 0 #2a1a4a;
        }
        .btn.equals {
            background: #7c5cbf;
            color: #fff;
            box-shadow: 0 4px 0 #5a3a9a;
        }
        .btn.equals:hover {
            background: #8c6ccf;
        }
        .btn.equals:active {
            box-shadow: 0 0px 0 #5a3a9a;
        }
        .btn.clear {
            background: #5a2a2a;
            color: #ff8888;
            box-shadow: 0 4px 0 #4a1a1a;
        }
        .btn.clear:hover {
            background: #6a3a3a;
        }
        .btn.clear:active {
            box-shadow: 0 0px 0 #4a1a1a;
        }
        .btn.span2 {
            grid-column: span 2;
        }
        .btn.fn {
            background: #2a3a3a;
            color: #88ddcc;
            box-shadow: 0 4px 0 #1a2a2a;
        }
        .btn.fn:hover {
            background: #3a4a4a;
        }
        .btn.fn:active {
            box-shadow: 0 0px 0 #1a2a2a;
        }
        .footer {
            text-align: center;
            margin-top: 16px;
            color: #555;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
            <button class="btn clear" data-action="clear">AC</button>
            <button class="btn fn" data-action="negate">±</button>
            <button class="btn fn" data-action="percent">%</button>
            <button class="btn operator" data-action="divide">÷</button>

            <button class="btn" data-action="7">7</button>
            <button class="btn" data-action="8">8</button>
            <button class="btn" data-action="9">9</button>
            <button class="btn operator" data-action="multiply">×</button>

            <button class="btn" data-action="4">4</button>
            <button class="btn" data-action="5">5</button>
            <button class="btn" data-action="6">6</button>
            <button class="btn operator" data-action="subtract">−</button>

            <button class="btn" data-action="1">1</button>
            <button class="btn" data-action="2">2</button>
            <button class="btn" data-action="3">3</button>
            <button class="btn operator" data-action="add">+</button>

            <button class="btn span2" data-action="0">0</button>
            <button class="btn" data-action="dot">.</button>
            <button class="btn equals" data-action="equals">=</button>
        </div>
        <div class="footer">⌨️ 支持键盘输入</div>
    </div>

    <script>
        // ======================== 计算器核心 ========================
        class Calculator {
            constructor() {
                this.reset();
            }

            reset() {
                this.current = '0';      // 当前输入的数字
                this.previous = '';      // 前一个数字
                this.operator = '';      // 当前运算符
                this.shouldReset = false; // 下次输入是否重置
                this.expression = '';     // 显示的表达式
            }

            // 输入数字
            inputDigit(digit) {
                if (this.shouldReset) {
                    this.current = digit;
                    this.shouldReset = false;
                } else {
                    if (this.current === '0' && digit !== '.') {
                        this.current = digit;
                    } else {
                        if (this.current.replace('-','').replace('.','').length >= 15) return;
                        this.current += digit;
                    }
                }
            }

            // 输入小数点
            inputDot() {
                if (this.shouldReset) {
                    this.current = '0.';
                    this.shouldReset = false;
                    return;
                }
                if (!this.current.includes('.')) {
                    this.current += '.';
                }
            }

            // 取反
            negate() {
                if (this.current === '0') return;
                this.current = this.current.startsWith('-') 
                    ? this.current.slice(1) 
                    : '-' + this.current;
            }

            // 百分号
            percent() {
                const num = parseFloat(this.current);
                this.current = String(num / 100);
            }

            // 运算符
            setOperator(op) {
                const cur = parseFloat(this.current);
                if (this.operator && !this.shouldReset) {
                    const prev = parseFloat(this.previous);
                    const result = this.compute(prev, cur, this.operator);
                    this.current = String(result);
                    this.expression = this.formatNumber(this.current) + ' ' + this.getOpSymbol(op);
                } else {
                    this.expression = this.formatNumber(this.current) + ' ' + this.getOpSymbol(op);
                }
                this.previous = this.current;
                this.operator = op;
                this.shouldReset = true;
            }

            getOpSymbol(op) {
                const map = {
                    'add': '+', 'subtract': '−', 
                    'multiply': '×', 'divide': '÷'
                };
                return map[op] || op;
            }

            compute(a, b, op) {
                switch (op) {
                    case 'add': return a + b;
                    case 'subtract': return a - b;
                    case 'multiply': return a * b;
                    case 'divide': return b !== 0 ? a / b : 'Error';
                    default: return b;
                }
            }

            // 等于
            equals() {
                if (!this.operator) return;
                const cur = parseFloat(this.current);
                const prev = parseFloat(this.previous);
                const result = this.compute(prev, cur, this.operator);
                this.expression = this.formatNumber(this.previous) + ' ' 
                    + this.getOpSymbol(this.operator) + ' ' 
                    + this.formatNumber(this.current) + ' =';
                this.current = result === 'Error' ? 'Error' : String(result);
                this.operator = '';
                this.previous = '';
                this.shouldReset = true;
            }

            // 清除
            clear() {
                this.reset();
            }

            // 删除一位
            backspace() {
                if (this.shouldReset) return;
                if (this.current.length <= 1 || (this.current.length === 2 && this.current.startsWith('-'))) {
                    this.current = '0';
                } else {
                    this.current = this.current.slice(0, -1);
                }
            }

            // 格式化数字显示（加千位分隔符）
            formatNumber(numStr) {
                if (numStr === 'Error') return 'Error';
                const parts = numStr.split('.');
                parts[0] = parts[0].replace(/,/g, '');
                let intPart = parts[0];
                const isNegative = intPart.startsWith('-');
                if (isNegative) intPart = intPart.slice(1);
                intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                if (isNegative) intPart = '-' + intPart;
                parts[0] = intPart;
                return parts.join('.');
            }

            // 获取显示用的当前值
            getDisplayCurrent() {
                if (this.current === 'Error') return 'Error';
                let val = this.current;
                if (val.length > 16) {
                    val = parseFloat(val).toExponential(6);
                }
                return this.formatNumber(val);
            }

            // 获取表达式显示
            getDisplayExpression() {
                return this.expression;
            }
        }

        // ======================== UI 控制器 ========================
        const calc = new Calculator();
        const resultEl = document.getElementById('result');
        const exprEl = document.getElementById('expression');

        function updateDisplay() {
            const val = calc.getDisplayCurrent();
            resultEl.textContent = val;
            if (val.length > 12) {
                resultEl.classList.add('small');
            } else {
                resultEl.classList.remove('small');
            }
            exprEl.textContent = calc.getDisplayExpression();
        }

        // 按钮点击事件
        document.querySelector('.buttons').addEventListener('click', (e) => {
            const btn = e.target.closest('.btn');
            if (!btn) return;
            const action = btn.dataset.action;
            handleAction(action);
        });

        // 键盘支持
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key >= '0' && key <= '9') {
                handleAction(key);
                e.preventDefault();
            } else if (key === '.') {
                handleAction('dot');
                e.preventDefault();
            } else if (key === '+') {
                handleAction('add');
                e.preventDefault();
            } else if (key === '-') {
                handleAction('subtract');
                e.preventDefault();
            } else if (key === '*') {
                handleAction('multiply');
                e.preventDefault();
            } else if (key === '/') {
                handleAction('divide');
                e.preventDefault();
            } else if (key === 'Enter' || key === '=') {
                handleAction('equals');
                e.preventDefault();
            } else if (key === 'Backspace') {
                handleAction('backspace');
                e.preventDefault();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                handleAction('clear');
                e.preventDefault();
            } else if (key === '%') {
                handleAction('percent');
                e.preventDefault();
            }
        });

        function handleAction(action) {
            switch (action) {
                case 'clear':         calc.clear(); break;
                case 'negate':        calc.negate(); break;
                case 'percent':       calc.percent(); break;
                case 'divide':
                case 'multiply':
                case 'subtract':
                case 'add':           calc.setOperator(action); break;
                case 'equals':        calc.equals(); break;
                case 'dot':           calc.inputDot(); break;
                case 'backspace':     calc.backspace(); break;
                default:
                    if (/^\d$/.test(action)) calc.inputDigit(action);
                    break;
            }
            updateDisplay();
        }

        // 初始化
        updateDisplay();
    </script>
</body>
</html>
