name: Release

# `bun run release` pushes a vX.Y.Z tag, which runs this workflow: it checks the tagged
# commit like CI does, publishes it to npm with provenance (trusted publishing, no token),
# then creates the GitHub release from the version's CHANGELOG.md section.
# Run it by hand with a tag to retry; matching published package versions are verified,
# and only missing packages publish in dependency order before the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: version
        run: |
          set -euo pipefail
          bun scripts/release.ts --status >> "$GITHUB_OUTPUT"

  check:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  publish:
    needs: [prepare, check]
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          registry-url: 'https://registry.npmjs.org'
      # No dependency install scripts while the job can mint an npm OIDC token; the build is tsc only
      - run: bun install --frozen-lockfile --ignore-scripts
      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@11.16.0 --ignore-scripts
      # Publish the same tarball format verified by consumer smoke, core first and umbrella last.
      - run: bun scripts/release.ts --publish

  github-release:
    needs: [prepare, publish]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.published == 'true' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bun scripts/changelog.ts notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          if [[ "${TAG}" == *-* ]]; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --prerelease
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
