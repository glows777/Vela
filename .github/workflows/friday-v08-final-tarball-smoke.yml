name: v0.8 exact-tree installed tarball smoke
on:
  push:
    branches: [friday/v08-final-tarball-smoke-e1de8bf]
permissions:
  contents: read
jobs:
  tarballs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e1de8bfa0fec911d96b2df8b58ca035be20327a4
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.18.0'
      - name: Validate six local tarballs and offline first invocation
        shell: bash
        run: |
          set -euo pipefail
          sha=e1de8bfa0fec911d96b2df8b58ca035be20327a4
          echo "Candidate $(git rev-parse HEAD) tree $(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "$sha"
          test "$(git rev-parse HEAD^{tree})" = 8326b6e528eaf94a1ddb07987b98392845d6a2de
          w="$(mktemp -d)"
          trap 'rm -rf "$w"' EXIT
          export VELA_ACCEPTANCE_PACK_DIR="$w"
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          bun -e 'import { packWorkspaces } from "./scripts/workspaces.ts"; const sha=(await Bun.$`git rev-parse HEAD`.quiet().text()).trim(); const list=await packWorkspaces(process.cwd(),process.env.VELA_ACCEPTANCE_PACK_DIR!); if(list.length!==6||list.some(p=>p.manifest.gitHead!==sha)) throw Error("tarball provenance mismatch"); for(const p of list) console.log(p.name+" "+p.manifest.gitHead)'
          mkdir "$w/app" "$w/install-home" "$w/cli-home" "$w/cli-data"
          printf '{"name":"vela-v08-candidate-acceptance","private":true}\n' > "$w/app/package.json"
          cd "$w/app"
          env -i PATH="$PATH" HOME="$w/install-home" npm install --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org "$w"/pack/*.tgz
          export VELA_ACCEPTANCE_SHA="$sha"
          node --input-type=module <<'VERIFY'
          import assert from 'node:assert/strict'
          import { createRequire } from 'node:module'
          import { readFileSync } from 'node:fs'
          import { join, resolve } from 'node:path'
          const names = ['vela-core','vela-channels','vela-mcp','vela-rag','vela-lark','vela'].map(x => '@glows777/'+x)
          for (const pkg of names) {
            const path = resolve('node_modules',pkg,'package.json')
            const data = JSON.parse(readFileSync(path,'utf8'))
            assert.equal(data.gitHead,process.env.VELA_ACCEPTANCE_SHA)
            const req = createRequire(path)
            for (const name of Object.keys(data.dependencies ?? {}).filter(k => names.includes(k))) {
              const entry = req.resolve(name)
              assert.ok(entry.startsWith(resolve('node_modules',name,'dist')+'/'),`${pkg} resolved wrong copy of ${name}: ${entry}`)
            }
          }
          console.log('All six installed package manifests and internal dependency resolutions match the candidate')
          VERIFY
          cli=node_modules/@glows777/vela/dist/cli/main.js
          env -i PATH="$PATH" HOME="$w/cli-home" VELA_DIR="$w/cli-data" VELA_OFFLINE=1 node "$cli" --help > "$w/help.txt"
          test -s "$w/help.txt"
          touch "$w/app/vela-candidate-fixture.txt"
          env -i PATH="$PATH" HOME="$w/cli-home" VELA_DIR="$w/cli-data" VELA_MODEL=mock VELA_OFFLINE=1 node "$cli" --mode json "list files" > "$w/cli.jsonl"
          grep -q vela-candidate-fixture.txt "$w/cli.jsonl"
          echo 'PASS: six local tarballs installed together; packaged Node CLI mock turn completed'
