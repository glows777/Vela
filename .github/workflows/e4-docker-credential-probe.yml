name: E4 one-off Docker synthetic credential verification

on:
  push:
    branches: [friday/e4-linux-docker-credential-check]

permissions: {}

jobs:
  verify-synthetic-credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify production HTTPS proxy and guest credential helper in Docker
        shell: bash
        run: |
          set -euo pipefail
          docker version
          export FIXTURE_BRIDGE="$(docker network inspect bridge --format '{{with index .IPAM.Config 0}}{{.Gateway}}{{end}}')"
          test -n "$FIXTURE_BRIDGE"
          export FIXTURE_IMAGE="docker.io/library/node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb"
          docker pull "$FIXTURE_IMAGE"
          p="$(mktemp -d)"
          trap 'rm -rf -- "$p"' EXIT
          cd "$p"
          cat > credential-identity.ts <<'VELA_E4_SOURCE'
          import { execFile } from 'node:child_process'
          import { randomBytes } from 'node:crypto'
          import { mkdtemp, readFile, rm, writeFile } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { promisify } from 'node:util'

          const exec = promisify(execFile)

          // Inputs are the validated, normalized DNS names of the owner's credential
          // origins. Only the bridge's public CA is sent to the guest.
          export async function createCredentialIdentity(hosts: readonly string[]) {
            const dir = await mkdtemp(join(tmpdir(), 'vela-credential-tls-'))
            try {
              const caExt = join(dir, 'ca.cnf')
              const leafExt = join(dir, 'leaf.cnf')
              const caKey = join(dir, 'ca.key')
              const caCert = join(dir, 'ca.pem')
              const leafKey = join(dir, 'leaf.key')
              const leafRequest = join(dir, 'leaf.csr')
              const leafCert = join(dir, 'leaf.pem')
              await writeFile(
                caExt,
                [
                  '[req]',
                  'distinguished_name=dn',
                  'x509_extensions=ca',
                  '[dn]',
                  '[ca]',
                  'basicConstraints=critical,CA:TRUE,pathlen:0',
                  'keyUsage=critical,keyCertSign',
                ].join('\n'),
              )
              await writeFile(
                leafExt,
                [
                  'basicConstraints=critical,CA:FALSE',
                  'keyUsage=critical,digitalSignature',
                  'extendedKeyUsage=serverAuth',
                  `subjectAltName=${hosts.map((name) => `DNS:${name}`).join(',')}`,
                ].join('\n'),
              )
              const run = (args: string[]) =>
                exec('openssl', args, {
                  env: { PATH: '/usr/local/bin:/usr/bin:/bin' },
                  timeout: 10_000,
                })
              for (const path of [caKey, leafKey])
                await run([
                  'ecparam',
                  '-name',
                  'prime256v1',
                  '-genkey',
                  '-noout',
                  '-out',
                  path,
                ])
              await run([
                'req',
                '-x509',
                '-new',
                '-key',
                caKey,
                '-sha256',
                '-days',
                '365',
                '-subj',
                '/CN=Vela credential proxy CA',
                '-config',
                caExt,
                '-out',
                caCert,
              ])
              await run([
                'req',
                '-new',
                '-key',
                leafKey,
                '-sha256',
                '-subj',
                '/CN=Vela credential proxy',
                '-config',
                caExt,
                '-out',
                leafRequest,
              ])
              await run([
                'x509',
                '-req',
                '-in',
                leafRequest,
                '-CA',
                caCert,
                '-CAkey',
                caKey,
                '-set_serial',
                `0x${randomBytes(16).toString('hex')}`,
                '-sha256',
                '-days',
                '365',
                '-extfile',
                leafExt,
                '-out',
                leafCert,
              ])
              const [ca, key, cert] = await Promise.all(
                [caCert, leafKey, leafCert].map((file) => readFile(file, 'utf8')),
              )
              return { ca: ca!, key: key!, cert: cert! }
            } catch (error) {
              if ((error as NodeJS.ErrnoException).code === 'ENOENT')
                throw Error('OpenSSL is required on the host for Docker credentials')
              throw Error('Could not create Docker credential proxy TLS identity')
            } finally {
              await rm(dir, { force: true, recursive: true })
            }
          }
          VELA_E4_SOURCE
          cat > credential-proxy.ts <<'VELA_E4_SOURCE'
          import {
            type ClientRequest,
            createServer as createHttpServer,
            type Server as HttpServer,
            type IncomingHttpHeaders,
            type IncomingMessage,
          } from 'node:http'
          import {
            createServer as createTlsServer,
            type RequestOptions,
            request,
          } from 'node:https'
          import { connect, isIP, type Socket } from 'node:net'
          import type { TLSSocket } from 'node:tls'

          type Credential = {
            placeholder: string
            value: string
            origins: readonly string[]
          }

          type Options = {
            listenHost: string
            identity: { key: string | Buffer; cert: string | Buffer }
            credentials: readonly Credential[]
            upstreamRequest?: (
              options: RequestOptions,
              callback: (response: IncomingMessage) => void,
            ) => ClientRequest
          }

          const loopback = '127.0.0.1'
          const hopHeaders = [
            'connection',
            'keep-alive',
            'proxy-authenticate',
            'proxy-authorization',
            'proxy-connection',
            'te',
            'trailer',
            'transfer-encoding',
            'upgrade',
          ]

          function endToEndHeaders(headers: IncomingHttpHeaders) {
            const clean = { ...headers }
            for (const name of [
              ...hopHeaders,
              ...(headers.connection?.split(',') ?? []),
            ]) {
              delete clean[name.trim().toLowerCase()]
            }
            return clean
          }

          function authorizationFor(header: string, credentials: readonly Credential[]) {
            const parts = /^(Bearer|token|Basic) ([^\s]+)$/iu.exec(header)
            if (!parts) return header
            const [, scheme, input] = parts
            if (scheme!.toLowerCase() === 'basic') {
              const bytes = Buffer.from(input!, 'base64')
              if (bytes.toString('base64') !== input) return header
              const text = bytes.toString()
              const colon = text.indexOf(':')
              if (colon < 0) return header
              const found = credentials.find(
                (c) => text.slice(colon + 1) === c.placeholder,
              )
              return found
                ? `Basic ${Buffer.from(text.slice(0, colon + 1) + found.value).toString('base64')}`
                : header
            }
            const found = credentials.find((c) => c.placeholder === input)
            return found ? `${scheme} ${found.value}` : header
          }

          async function listen(server: HttpServer, host: string) {
            return new Promise<number>((resolve, reject) => {
              server.once('error', reject)
              server.listen(0, host, () => {
                server.off('error', reject)
                const address = server.address()
                if (address && typeof address === 'object') resolve(address.port)
                else reject(Error('Docker credential proxy did not bind a TCP address'))
              })
            })
          }

          /** A CONNECT endpoint only for owner-approved credential origins, not a general forward proxy. */
          export async function openCredentialProxy(options: Options) {
            const byHost = new Map<string, Credential[]>()
            for (const entry of options.credentials) {
              for (const origin of entry.origins) {
                const url = URL.parse(origin)
                if (
                  url?.protocol !== 'https:' ||
                  origin !== url.origin ||
                  url.port ||
                  isIP(url.hostname)
                )
                  throw Error('Invalid Docker credential proxy origin')
                const list = byHost.get(url.hostname) ?? []
                list.push(entry)
                byHost.set(url.hostname, list)
              }
            }
            const owned = new Set<Socket>()
            function own(socket: Socket) {
              owned.add(socket)
              socket.once('close', () => owned.delete(socket))
              socket.on('error', () => socket.destroy())
            }

            // The raw inbound socket survives CONNECT. A private loopback relay lets the
            // runtime serve normal HTTPS without handing an already-used socket to its TLS
            // parser (unsupported by Bun). Only proxy-owned relay sockets can send requests.
            const routes = new Map<number, { host: string; relay: Socket }>()
            const tls = createTlsServer(options.identity, (incoming, outgoing) => {
              const { remoteAddress, remotePort, servername } =
                incoming.socket as TLSSocket
              const route =
                remoteAddress === loopback && remotePort
                  ? routes.get(remotePort)
                  : undefined
              const target = route && !route.relay.destroyed ? route.host : undefined
              const authorized = target ? byHost.get(target) : undefined
              const host = incoming.headers.host?.toLowerCase()
              const path = incoming.url
              if (
                !target ||
                !authorized ||
                typeof servername !== 'string' ||
                servername.toLowerCase() !== target ||
                (host !== target && host !== `${target}:443`) ||
                !path?.startsWith('/') ||
                path.startsWith('//')
              ) {
                outgoing.writeHead(403, { connection: 'close' }).end()
                return
              }
              const headers = endToEndHeaders(incoming.headers)
              if (headers.authorization)
                headers.authorization = authorizationFor(
                  headers.authorization,
                  authorized,
                )
              const failed = () => {
                if (outgoing.headersSent) outgoing.destroy()
                else outgoing.writeHead(502, { connection: 'close' }).end()
              }
              try {
                const channel = (options.upstreamRequest ?? request)(
                  {
                    hostname: target,
                    port: 443,
                    servername: target,
                    rejectUnauthorized: true,
                    method: incoming.method,
                    headers,
                    path,
                  },
                  (response) => {
                    outgoing.writeHead(
                      response.statusCode ?? 502,
                      endToEndHeaders(response.headers),
                    )
                    response.once('error', failed)
                    response.pipe(outgoing)
                  },
                )
                channel.once('error', failed)
                channel.setTimeout(30_000, () => channel.destroy())
                incoming.on('error', () => channel.destroy())
                outgoing.once('close', () => channel.destroy())
                incoming.pipe(channel)
              } catch {
                failed()
              }
            })
            tls.on('connection', own)
            const innerPort = await listen(tls, loopback)
            const proxy = createHttpServer((_incoming, outgoing) => {
              outgoing.writeHead(403, { connection: 'close' }).end()
            })
            proxy.on('connection', own)
            proxy.on('connect', (incoming, socket, head) => {
              const host = /^([a-z0-9.-]+):443$/iu
                .exec(incoming.url ?? '')?.[1]
                ?.toLowerCase()
              if (!host || !byHost.has(host)) {
                socket.end('HTTP/1.1 403 Forbidden\r\nConnection: close\r\n\r\n')
                return
              }
              socket.pause()
              const relay = connect(innerPort, loopback)
              own(relay)
              socket.once('close', () => relay.destroy())
              relay.once('close', () => socket.destroy())
              relay.once('connect', () => {
                const port = relay.localPort
                if (!port) {
                  relay.destroy()
                  return
                }
                const route = { host, relay }
                routes.set(port, route)
                relay.once('close', () => {
                  if (routes.get(port) === route) routes.delete(port)
                })
                socket.write('HTTP/1.1 200 Connection Established\r\n\r\n')
                if (head.length) relay.write(head)
                socket.pipe(relay).pipe(socket)
              })
            })
            let closing: Promise<void> | undefined
            const close = () => {
              closing ??= Promise.all([
                new Promise<void>((done) => proxy.close(() => done())),
                new Promise<void>((done) => tls.close(() => done())),
              ]).then(() => undefined)
              for (const socket of owned) socket.destroy()
              return closing
            }
            try {
              return { port: await listen(proxy, options.listenHost), close }
            } catch (cause) {
              await close()
              throw cause
            }
          }
          VELA_E4_SOURCE
          cat > guest-credential-env.ts <<'VELA_E4_SOURCE'
          import { mkdtemp, rm, writeFile } from 'node:fs/promises'
          import { join } from 'node:path'

          export type GuestCredentialConfig = {
            publicCa: string
            proxyUrl: string
            placeholders: Record<string, string>
            githubGit: boolean
          }

          export async function prepareGuestCredentials(config: GuestCredentialConfig) {
            const dir = await mkdtemp('/tmp/vela-credential-ca-')
            const ca = join(dir, 'ca.pem')
            const close = () => rm(dir, { force: true, recursive: true })
            try {
              await writeFile(ca, config.publicCa, { mode: 0o600 })
              const env: Record<string, string> = {
                ...config.placeholders,
                HTTPS_PROXY: config.proxyUrl,
                https_proxy: config.proxyUrl,
                SSL_CERT_FILE: ca,
                GIT_SSL_CAINFO: ca,
              }
              if (config.githubGit)
                Object.assign(env, {
                  GIT_CONFIG_COUNT: '1',
                  GIT_CONFIG_KEY_0: 'credential.https://github.com.helper',
                  GIT_CONFIG_VALUE_0:
                    '!f() { if [ "$1" = get ]; then printf "username=x-access-token\\npassword=%s\\n" "$GH_TOKEN"; fi; }; f',
                })
              return { env, close }
            } catch (error) {
              await close()
              throw error
            }
          }
          VELA_E4_SOURCE
          cat > driver.ts <<'VELA_E4_SOURCE'
          import { expect, test } from 'bun:test'
          import { mkdtemp, writeFile, copyFile, chmod, rm } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { createServer, request } from 'node:https'
          import { createCredentialIdentity } from './credential-identity.ts'
          import { openCredentialProxy } from './credential-proxy.ts'

          test('non-root Linux Docker guest uses placeholder; host HTTPS proxy supplies the synthetic value', async () => {
            const root = await mkdtemp(join(tmpdir(), 'vela-e4-public-'))
            const host = process.env.FIXTURE_BRIDGE
            const image = process.env.FIXTURE_IMAGE
            if (!host || !image) throw Error('No test-engine configuration')
            const placeholder = 'vela-fixture-placeholder'
            const value = 'vela-synthetic-owner-value'
            const origin = 'https://github.com'
            const gitAuthorization: (string | undefined)[] = []
            const curlAuthorization: (string | undefined)[] = []
            const identity = await createCredentialIdentity(['github.com'])
            const originIdentity = await createCredentialIdentity(['github.com'])
            const upstream = createServer(originIdentity, (req, res) => {
              if (req.url === '/probe/info/refs?service=git-upload-pack') {
                gitAuthorization.push(req.headers.authorization)
                const expected = 'Basic ' + Buffer.from('x-access-token:' + value).toString('base64')
                if (req.headers.authorization !== expected) {
                  res.writeHead(401, { 'www-authenticate': 'Basic realm="docker-fixture"' }).end()
                  return
                }
                res.writeHead(200, { 'content-type': 'application/x-git-upload-pack-advertisement' })
                res.end('001e# service=git-upload-pack\n00000000')
                return
              }
              if (req.url === '/identity') {
                curlAuthorization.push(req.headers.authorization)
                res.end('verified-loopback-marker')
                return
              }
              res.writeHead(404).end()
            })
            let close: (() => Promise<void>) | undefined
            try {
              await new Promise<void>((resolve, reject) => {
                upstream.once('error', reject)
                upstream.listen(0, '127.0.0.1', resolve)
              })
              const addr = upstream.address()
              if (!addr || typeof addr === 'string') throw Error('No test upstream port')
              const proxy = await openCredentialProxy({
                listenHost: host,
                identity,
                credentials: [{ placeholder, value, origins: [origin] }],
                upstreamRequest: (options, callback) => request({
                  ...options, hostname: '127.0.0.1', port: addr.port, ca: originIdentity.ca,
                }, callback),
              })
              close = proxy.close
              // The mounted directory contains only public CA, placeholder, and test/guest code.
              await chmod(root, 0o755)
              await writeFile(join(root, 'config.json'), JSON.stringify({
                publicCa: identity.ca,
                proxyUrl: 'http://host.docker.internal:' + proxy.port,
                placeholders: { GH_TOKEN: placeholder },
                githubGit: true,
              }), { mode: 0o644 })
              for (const name of ['guest-credential-env.ts', 'container.mjs']) {
                const dst = join(root, name)
                await copyFile(new URL(name, import.meta.url), dst)
                await chmod(dst, 0o644)
              }
              const command = Bun.spawn([
                'docker', 'run', '--rm', '--pull=never', '--network', 'bridge',
                '--add-host', 'host.docker.internal=host-gateway',
                '--add-host', 'github.com=127.0.0.1',
                '--user', '65534:65534', '--cap-drop', 'ALL',
                '--security-opt', 'no-new-privileges',
                '--mount', 'type=bind,src=' + root + ',dst=/fixture,readonly',
                image, 'node', '--experimental-strip-types', '/fixture/container.mjs',
              ], { stdout: 'pipe', stderr: 'pipe', env: { PATH: process.env.PATH ?? '' } })
              const [status, stdout, stderr] = await Promise.all([
                command.exited, new Response(command.stdout).text(), new Response(command.stderr).text(),
              ])
              if (status !== 0) throw Error('Container fixture failed: ' + status + '\n' + stderr + stdout)
              expect(stdout.trim()).toBe('PASS: guest placeholder, HTTPS trust, curl and Git')
              expect(curlAuthorization).toEqual(['Bearer ' + value])
              expect(gitAuthorization).toEqual([
                undefined, 'Basic ' + Buffer.from('x-access-token:' + value).toString('base64'),
              ])
            } finally {
              await close?.()
              upstream.closeAllConnections()
              upstream.close()
              await rm(root, { recursive: true, force: true })
            }
          }, 60_000)
          VELA_E4_SOURCE
          cat > container.mjs <<'VELA_E4_SOURCE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          import { strict as assert } from 'node:assert'
          import { prepareGuestCredentials } from './guest-credential-env.ts'

          assert.equal(process.getuid(), 65534)
          const config = JSON.parse(readFileSync('/fixture/config.json', 'utf8'))
          const guest = await prepareGuestCredentials(config)
          try {
            const env = {
              PATH: process.env.PATH,
              HOME: '/tmp',
              GIT_CONFIG_GLOBAL: '/dev/null',
              GIT_CONFIG_NOSYSTEM: '1',
              GIT_TERMINAL_PROMPT: '0',
              ...guest.env,
            }
            assert.equal(env.GH_TOKEN, 'vela-fixture-placeholder')
            const got = execFileSync('curl', [
              '--silent', '--show-error', '--fail', '--max-time', '6',
              '--noproxy', '', '--cacert', env.SSL_CERT_FILE,
              '--header', 'Authorization: Bearer ' + env.GH_TOKEN,
              'https://github.com/identity',
            ], { env, encoding: 'utf8', timeout: 8_000 })
            assert.equal(got, 'verified-loopback-marker')
            assert.equal(execFileSync('git', ['ls-remote', 'https://github.com/probe'],
              { env, encoding: 'utf8', timeout: 8_000 }), '')
            console.log('PASS: guest placeholder, HTTPS trust, curl and Git')
          } finally {
            await guest.close()
          }
          VELA_E4_SOURCE
          bun test driver.ts
