name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # 包要能在 Node 上用：消费者冒烟用最低支持的 Node 版本跑 SDK 和 CLI
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
      - run: bun install --frozen-lockfile
      # test/live 需要真实模型，不在 CI 里跑（bun run test 只含 unit + e2e）
      - name: Test
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # build + 打包后装进空的 Node 项目和 Bun 项目，按消费者的方式 import / typecheck / 跑 CLI（要联网装依赖）
      - name: Consumer smoke test
        run: bun run smoke:consumer
