name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The package must work on Node: the consumer smoke test runs the SDK and CLI on the oldest supported Node
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
      - run: bun install --frozen-lockfile
      # test/live needs a real model and doesn't run in CI (bun run test covers unit + e2e only)
      - name: Test
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      # Build, pack and install into empty Node and Bun projects; import, type-check and run the CLI like a consumer (needs network)
      - name: Consumer smoke test
        run: bun run smoke:consumer
