name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs the same checks on the tagged commit before publishing
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      skip_desktop:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The package must work on Node: the consumer smoke test runs the SDK and CLI on the oldest supported Node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
      # grep / find run ripgrep / fd (Ubuntu names fd `fdfind`; Vela looks for both)
      - run: sudo apt-get install -y ripgrep fd-find
      - run: bun install --frozen-lockfile
      # test/live needs a real model and doesn't run in CI (bun run test covers unit + e2e only)
      - name: Test
        run: bun run test
      - name: Desktop foundation checks
        run: bun run desktop:check
      - name: Typecheck
        run: bun run typecheck
      # biome check: formatting, import order and lint
      - name: Lint
        run: bun run lint
      # quality ratchet: no new dead code, no new circular dependencies, no file over its line ceiling
      - name: Quality
        run: bun run quality
      # offline verify-vela journeys: drive the real CLI, SDK and channels end to end;
      # github-setup-journey.ts needs a package registry and the runner leaves it out
      - name: Journeys
        run: bun run verify:journeys
      # Build, pack and install into empty Node and Bun projects; import, type-check and run the CLI like a consumer (needs network)
      - name: Consumer smoke test
        run: bun run smoke:consumer

  desktop-impact:
    if: ${{ github.event_name == 'pull_request' && !inputs.ref && !inputs.skip_desktop }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip_desktop: ${{ steps.paths.outputs.skip_desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow tests the GitHub merge commit, not the contributor's head.
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        name: Check whether all changed paths are unrelated to Desktop
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ||
                "$(git rev-parse --verify -q HEAD^1)" != "$PR_BASE_SHA" ]] ||
             ! git rev-parse --verify -q HEAD^2 > /dev/null; then
            echo '::warning::Could not confirm the tested PR merge and base; running Desktop CI.'
            exit 0
          fi
          changed=$(mktemp)
          trap 'rm -f "$changed"' EXIT
          # Treat a rename as a deletion plus an addition so both paths are checked.
          git diff --no-ext-diff --no-renames --name-only -z "$PR_BASE_SHA" HEAD -- > "$changed"
          [[ -s "$changed" ]] || exit 0
          while IFS= read -r -d '' path; do
            # Root prose and the terminal-only startup portrait are not Desktop inputs.
            # Do not include docs/: the SDK build copies it into the package.
            case "$path" in
              README.md|CONTRIBUTING.md) ;;
              packages/vela/src/cli/tui/logo.ts|packages/vela/test/unit/cli/logo.test.ts) ;;
              *) exit 0 ;;
            esac
          done < "$changed"
          echo 'skip_desktop=true' >> "$GITHUB_OUTPUT"

  desktop-package:
    needs: desktop-impact
    # A skipped or failed classifier must not skip macOS. !cancelled() overrides implicit success().
    if: >-
      ${{ !cancelled() && !inputs.skip_desktop &&
          (needs.desktop-impact.result != 'success' || needs.desktop-impact.outputs.skip_desktop != 'true') }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
      - run: bun install --frozen-lockfile
      - name: Verify desktop integration in Electron
        run: bun run desktop:verify
      - run: bun run desktop:package
      - name: Verify packaged desktop shell
        run: bun run desktop:verify --packaged "apps/desktop/out/Vela-darwin-$(bun -p process.arch)/Vela.app"
